# Use Option+A as prefix
unbind M-b
set -g prefix M-a
bind M-a send-prefix

# Random
set -g mouse on
set -g escape-time 10
set -g base-index 1
set -g pane-base-index 1

set -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#(whoami)@#h:#S - #W"

# Config reloads
bind r source-file ~/.tmux.conf

# Detach sessions
bind -n "M-d" detach

# Close pane/window
bind -n "M-w" confirm-before -p "Close pane #W? (y/n)" kill-pane
bind -n "M-W" confirm-before -p "Close window #W? (y/n)" kill-window

# Panes
bind -n "M-|" split-window -h -c "#{pane_current_path}"
bind -n "M-_" split-window -v -c "#{pane_current_path}"
bind -n "M-S-Left" select-pane -L
bind -n "M-S-Right" select-pane -R
bind -n "M-S-Up" select-pane -U
bind -n "M-S-Down" select-pane -D

# Windows navigation
bind -n "M-n" new-window -c "#{pane_current_path}"
bind -n "M-t" new-window -c "#{pane_current_path}"
bind -n "M-{" previous-window
bind -n "M-}" next-window
bind -n "M-1" select-window -t 1
bind -n "M-2" select-window -t 2
bind -n "M-3" select-window -t 3
bind -n "M-4" select-window -t 4
bind -n "M-5" select-window -t 5
bind -n "M-6" select-window -t 6
bind -n "M-7" select-window -t 7
bind -n "M-8" select-window -t 8
bind -n "M-9" select-window -t 9

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=yellow bold'
set -g status-left "[#S] "
set -g status-right "#{?client_prefix,#[reverse] Prefix #[noreverse] ,}%H:%M:%S"

set -g window-status-style 'fg=green bg=black nobold'
set -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '
set -g window-status-current-style 'fg=black bg=green bold'
set -g window-status-current-format ' #I #W #F '
set -g window-status-bell-style 'fg=yellow bg=red bold'

set-option -g message-style 'bg=yellow fg=black bold'
set-option -g message-command-style 'bg=black fg=yellow'
